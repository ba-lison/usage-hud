<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121214"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient></defs>
  <rect x="0.5" y="0.5" width="879" height="299" rx="16" fill="url(#bg)" stroke="#232326"/>
  <rect x="30.5" y="30.5" width="819" height="239" rx="12" fill="#151517" stroke="#2a2a2d"/>
  <circle cx="58" cy="64" r="4" fill="#a3e635"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
