<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif" style="font-variant-numeric:tabular-nums">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121214"/><stop offset="1" stop-color="#0a0a0b"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#a3e635" stop-opacity=".07"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
    <linearGradient id="win" x1="0" x2="1"><stop offset="0" stop-color="#d36241" stop-opacity=".45"/><stop offset="1" stop-color="#e07a5f"/></linearGradient>
    <linearGradient id="ctx" x1="0" x2="1"><stop offset="0" stop-color="#53b86a" stop-opacity=".45"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="359" rx="16" fill="url(#bg)" stroke="#232326"/>
  <rect x="0" y="0" width="880" height="360" rx="16" fill="url(#halo)"/>

  <!-- barra da janela -->
  <circle cx="26" cy="24" r="5.5" fill="#ff5f57"/><circle cx="44" cy="24" r="5.5" fill="#febc2e"/><circle cx="62" cy="24" r="5.5" fill="#28c840"/>
  <text x="440" y="28" text-anchor="middle" font-size="12" fill="#5a5a60">Claude Code</text>
  <line x1="0" y1="46" x2="880" y2="46" stroke="#1d1d20"/>

  <!-- conversa, esmaecida -->
  <rect x="40" y="70" width="300" height="9" rx="4.5" fill="#26262a"/>
  <rect x="40" y="88" width="520" height="9" rx="4.5" fill="#1f1f22"/>
  <rect x="40" y="106" width="430" height="9" rx="4.5" fill="#1f1f22"/>
  <rect x="40" y="124" width="250" height="9" rx="4.5" fill="#1b1b1e"/>

  <!-- o HUD -->
  <g filter="url(#shadow)">
    <rect x="30.5" y="156.5" width="819" height="88" rx="12" fill="#151517" stroke="#2a2a2d"/>
  </g>
  <g font-size="13">
    <!-- Janela 5h -->
    <text x="54" y="187" dominant-baseline="central" fill="#7c7c82">Janela 5h</text>
    <rect x="150" y="186" width="230" height="2" rx="1" fill="#fff" fill-opacity=".07"/>
    <rect x="150" y="186" width="96.6" height="2" rx="1" fill="url(#win)"><animate attributeName="width" from="0" to="96.6" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></rect>
    <circle cx="246.6" cy="187" r="5" fill="#e07a5f" opacity=".55" filter="url(#glow)"><animate attributeName="cx" from="150" to="246.6" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></circle>
    <circle cx="246.6" cy="187" r="2.2" fill="#e07a5f"><animate attributeName="cx" from="150" to="246.6" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></circle>
    <text x="404" y="187" dominant-baseline="central"><tspan fill="#f2f2f5" font-weight="500">42%</tspan><tspan fill="#525257" font-size="11" dx="2">/100%</tspan></text>
    <text x="490" y="187" dominant-baseline="central" fill="#85858b">renova às 19:40<tspan fill="#3f3f44" dx="8">·</tspan><tspan dx="8">faltam 2h 15min</tspan></text>

    <!-- Contexto -->
    <text x="54" y="215" dominant-baseline="central" fill="#7c7c82">Contexto</text>
    <rect x="150" y="214" width="230" height="2" rx="1" fill="#fff" fill-opacity=".07"/>
    <rect x="150" y="214" width="140.3" height="2" rx="1" fill="url(#ctx)"><animate attributeName="width" from="0" to="140.3" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></rect>
    <circle cx="290.3" cy="215" r="6" fill="#a3e635" opacity=".55" filter="url(#glow)"><animate attributeName="cx" from="150" to="290.3" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/></circle>
    <circle cx="290.3" cy="215" r="3" fill="#a3e635"><animate attributeName="cx" from="150" to="290.3" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".16 1 .3 1"/><animate attributeName="r" values="3;4;3" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="404" y="215" dominant-baseline="central" fill="#a3e635" font-weight="500">61%</text>
    <text x="490" y="215" dominant-baseline="central" fill="#85858b">122k de 200k<tspan fill="#3f3f44" dx="8">·</tspan><tspan fill="#6e6e73" dx="8">faltam </tspan><tspan fill="#a1a1a6">78k</tspan></text>

    <!-- botão -->
    <rect x="706.5" y="200.5" width="124" height="30" rx="8" fill="#1f1f22" stroke="#3a3a3f"/>
    <text x="768.5" y="216" text-anchor="middle" dominant-baseline="central" fill="#e6e6ea" font-size="12.5" font-weight="500">Gerar handoff</text>
  </g>

  <!-- campo de mensagem -->
  <rect x="30.5" y="262.5" width="819" height="64" rx="14" fill="#111113" stroke="#2a2a2d"/>
  <rect x="54" y="286" width="1.5" height="18" fill="#a3e635"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="62" y="295" dominant-baseline="central" font-size="14" fill="#55555b">Responda ao Claude…</text>
  <circle cx="815" cy="294.5" r="15" fill="#d97757"/>
  <path d="M815 301 V288 M809 293.5 L815 287.5 L821 293.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
